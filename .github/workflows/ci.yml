name: Validate source content

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Validate Patch and Question Tool source content
        run: npm test
